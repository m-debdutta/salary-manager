<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#4F46E5" stroke="#312E81" stroke-width="3"/>

  <!-- Dollar sign $ -->
  <g>
    <!-- Vertical line through the S -->
    <line x1="100" y1="50" x2="100" y2="150" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>

    <!-- S shape -->
    <path d="M 125 70 C 125 60 115 55 100 55 C 85 55 75 60 75 70 C 75 80 85 85 100 90 C 115 95 125 100 125 110 C 125 120 115 125 100 125 C 85 125 75 120 75 110"
          stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decorative coins -->
  <circle cx="150" cy="160" r="15" fill="#FCD34D" stroke="#F59E0B" stroke-width="2" opacity="0.9"/>
  <circle cx="50" cy="160" r="12" fill="#FCD34D" stroke="#F59E0B" stroke-width="2" opacity="0.9"/>

  <!-- Small coin details -->
  <text x="150" y="165" font-size="12" text-anchor="middle" fill="#F59E0B" font-weight="bold">$</text>
  <text x="50" y="164" font-size="10" text-anchor="middle" fill="#F59E0B" font-weight="bold">$</text>
</svg>
